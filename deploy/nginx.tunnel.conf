limit_req_zone $binary_remote_addr zone=lcplay_login:10m rate=5r/m;

server {
    listen 127.0.0.1:8087;
    server_name lcplay.thxtech.site;
    client_max_body_size 2m;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location = /api/auth/login {
        limit_req zone=lcplay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
    }
}

server {
    listen 127.0.0.1:8087;
    server_name api-lcplay.thxtech.site;
    client_max_body_size 2m;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location = /api/auth/login {
        limit_req zone=lcplay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
    }

    location / {
        return 404;
    }
}
