limit_req_zone $binary_remote_addr zone=lcplay_login:10m rate=5r/m;

server {
    listen 80;
    server_name lcplay.thxtech.site api-lcplay.thxtech.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lcplay-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lcplay.thxtech.site;
    ssl_certificate /etc/letsencrypt/live/lcplay.thxtech.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lcplay.thxtech.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/auth/login {
        limit_req zone=lcplay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}

server {
    listen 443 ssl;
    server_name api-lcplay.thxtech.site;
    ssl_certificate /etc/letsencrypt/live/lcplay.thxtech.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lcplay.thxtech.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/auth/login {
        limit_req zone=lcplay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    location / {
        return 404;
    }
}
